<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Blocked - Family Safe</title>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f8f9fa;
    font-family: Arial, sans-serif;
  }
  .card {
    background: white;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    max-width: 400px;
    text-align: center;
  }
  h2 { color: #856404; margin-bottom: 12px; }
  p { color: #6c757d; font-size: 14px; }
  #site { font-weight: bold; color: #856404; }
</style>
</head>
<body>
  <div class="card">
    <h2>Family Safe Filter Active</h2>
    <p>The site <span id="site"></span> has been blocked.</p>
    <p>This page was stopped from loading by Family Safe filtering.</p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('site').textContent = params.get('site') || 'this site';
  </script>
</body>
</html>
